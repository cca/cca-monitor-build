services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - ./targets:/etc/prometheus/targets:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    ports: ["9090:9090"]

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - am-data:/alertmanager
    ports: ["9093:9093"]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]

  vmware_exporter:
    image: pryorda/vmware_exporter:latest
    container_name: vmware_exporter
    restart: unless-stopped
    environment:
      VSPHERE_USER: svc-prometheus@vsphere.local
      VSPHERE_PASSWORD: ${VSPHERE_PASSWORD}
      VSPHERE_HOST: vcenter.example.edu
      VSPHERE_IGNORE_SSL: "true"
      VSPHERE_COLLECT_VMS: "true"
      VSPHERE_COLLECT_HOSTS: "true"
      VSPHERE_COLLECT_DATASTORES: "true"
    expose: ["9272"]

volumes:
  prom-data:
  am-data:
  grafana-data:

# add to docker-compose.yml
  vmware_exporter:
    image: pryorda/vmware_exporter
    environment:
      VSPHERE_USER: svc-prometheus@vsphere.local
      VSPHERE_PASSWORD: ${VSPHERE_PASSWORD}
      VSPHERE_HOST: vcenter.example.edu
      VSPHERE_IGNORE_SSL: "true"   # replace with a proper CA cert if possible
      VSPHERE_COLLECT_VMS: "true"
      VSPHERE_COLLECT_HOSTS: "true"
      VSPHERE_COLLECT_DATASTORES: "true"
    ports: ["9272:9272"]
