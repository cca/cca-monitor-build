global:
  scrape_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: linux
    file_sd_configs:
      - files: ['/etc/prometheus/targets/nodes-linux.json']

  - job_name: windows
    file_sd_configs:
      - files: ['/etc/prometheus/targets/nodes-windows.json']

  - job_name: vmware
    scrape_timeout: 25s
    static_configs:
      - targets: ['vmware_exporter:9272']
